<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner | Detumo Alex</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">Detumo<span>.Alex</span></div>
    <nav class="main-nav">
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="nav-list" id="navList">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html" class="active">Academic Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-intro">
      <h1>Academic Planner</h1>
      <p>Add, track, and complete your academic tasks and deadlines.</p>
    </section>

    <section class="planner">
      <form id="taskForm" class="task-form">
        <input type="text" id="taskInput" placeholder="Enter a task (e.g. Submit COS 106 project)" required>
        <input type="date" id="taskDueDate">
        <button type="submit" class="btn-primary">Add Task</button>
      </form>

      <div class="task-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <ul id="taskList" class="task-list">
        <!-- Tasks injected here by JavaScript -->
      </ul>

      <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Detumo Alex. Built for COS 106 Term Project, Miva Open University.</p>
  </footer>

  <script src="js/nav.js"></script>
  <script src="js/planner.js"></script>
</body>
</html>
